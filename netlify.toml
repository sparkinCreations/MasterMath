[build]
  # Netlify never builds this site itself: exit 0 tells it to skip the build.
  # GitHub Actions tests, builds and uploads dist/ (.github/workflows/checks.yml),
  # so the free plan's build minutes go unused. Remove this line to go back.
  ignore = "exit 0"
  # Only for a build Netlify is asked to run: the unit suite goes first, so a
  # failing test keeps the previous deploy live.
  command = "npm test && npm run build"
  publish = "dist"

# SPA fallback — direct links like /solver must serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Vite 8 requires Node ^20.19 || >=22.12; pin so Netlify never falls back to an older default.
  NODE_VERSION = "22"

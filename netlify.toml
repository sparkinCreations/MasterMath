[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — direct links like /solver must serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Vite 8 requires Node ^20.19 || >=22.12; pin so Netlify never falls back to an older default.
  NODE_VERSION = "22"

[build]
  # The unit suite runs first: a failing test fails the build, so Netlify
  # keeps serving the previous deploy instead of shipping the regression.
  # (The Playwright smoke test needs a browser and stays in GitHub Actions.)
  command = "npm test && npm run build"
  publish = "dist"

# SPA fallback — direct links like /solver must serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Vite 8 requires Node ^20.19 || >=22.12; pin so Netlify never falls back to an older default.
  NODE_VERSION = "22"

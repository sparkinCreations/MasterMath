# Dependency audit, unit suite and browser smoke test on every push and pull
# request.
#
# Netlify builds and deploys main on its own, but its build command runs the
# unit suite first (netlify.toml), so a failing unit test blocks the deploy.
# This workflow adds the dependency audit and the browser smoke test, which
# Netlify does not run; a red smoke test shows on the commit that caused it.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (shipped dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Unit suite (includes the corpus and the build-preload test)
        run: npm test
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test against the production build
        run: npm run smoke
        env:
          CI: 'true'
      - name: Upload the report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

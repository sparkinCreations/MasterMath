# Dependency audit, unit suite and browser smoke test on every push and pull
# request, then the deploy: a push to main goes live, a pull request from this
# repository gets a preview.
#
# Netlify's own builds are switched off (netlify.toml: ignore), because they
# used up the free plan's build minutes. The deploy job builds here and uploads
# the finished dist/, which uses none of them. It runs only after
# test-and-smoke passes, so a failing audit, unit test or smoke test stops it.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (shipped dependencies, high and critical)
        # npm's advisory endpoint has stalled from GitHub's runners until
        # npm's 5-minute fetch timeout, after which npm falls back to a
        # retired endpoint that answers 400 (October 2026). Ask again with a
        # short timeout. A real advisory fails every attempt, so the check is
        # no weaker; an endpoint that stays down still fails the step.
        run: |
          for attempt in 1 2 3; do
            npm audit --omit=dev --audit-level=high --fetch-timeout=60000 && exit 0
            echo "npm audit attempt $attempt failed" >&2
            [ "$attempt" -lt 3 ] && sleep 15
          done
          exit 1
      - name: Unit suite (includes the corpus and the build-preload test)
        run: npm test
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test against the production build
        run: npm run smoke
        env:
          CI: 'true'
      - name: Upload the report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    needs: test-and-smoke
    # A fork's pull request gets no preview: its code is not ours to publish,
    # and GitHub gives it no secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One upload at a time per target; a newer commit waiting replaces an older
    # one waiting, so the last push is the one that ends up live.
    concurrency:
      group: deploy-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: false
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 66658bad-d664-4bd0-a3a6-065c95c79abc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Stamps sw.js with this commit (vite.config.js), as on any other build.
      - run: npm run build
      # --no-build: netlify-cli would otherwise run the build command first.
      - name: Upload to production
        if: github.event_name == 'push'
        run: npx --yes netlify-cli@27.16.2 deploy --no-build --dir=dist --prod --message "${{ github.sha }}"
      - name: Upload a preview
        if: github.event_name == 'pull_request'
        run: |
          npx --yes netlify-cli@27.16.2 deploy --no-build --dir=dist --alias "pr-${{ github.event.pull_request.number }}" --message "${{ github.sha }}"
          echo "Preview: https://pr-${{ github.event.pull_request.number }}--mastermathapp.netlify.app" >> "$GITHUB_STEP_SUMMARY"

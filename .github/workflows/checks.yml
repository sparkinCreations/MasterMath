# Unit suite + browser smoke test on every push and pull request.
#
# Netlify builds and deploys main on its own; this workflow does not gate
# that (there is no user base to protect yet — see docs/future-work). It
# exists so a red smoke test is visible on the commit that caused it.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit suite (includes the corpus and the build-preload test)
        run: npm test
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test against the production build
        run: npm run smoke
        env:
          CI: 'true'
      - name: Upload the report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
